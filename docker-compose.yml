name: skillsync

x-backend-environment: &backend-environment
  SKILLSYNC_APP_NAME: SkillSync API
  SKILLSYNC_DATABASE_URL: ${SKILLSYNC_DATABASE_URL:?Set SKILLSYNC_DATABASE_URL in .env}
  SKILLSYNC_DEBUG: "false"
  SKILLSYNC_ENVIRONMENT: local

services:
  database:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-skillsync}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: skillsync-backend:local
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: ./backend
    image: skillsync-backend:local
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    ports:
      - "127.0.0.1:${SKILLSYNC_API_PORT:-8000}:8000"

volumes:
  postgres_data:
