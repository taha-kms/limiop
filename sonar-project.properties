sonar.projectKey=skillsync
sonar.projectName=SkillSync

sonar.sources=.
sonar.sourceEncoding=UTF-8

sonar.exclusions=docs/**,agent-skills/**,**/node_modules/**,**/.next/**,**/__pycache__/**,**/migrations/**

# Populated as each component starts producing reports.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
