sonar.projectKey=taha-kms_skillsync
sonar.organization=taha-kms
sonar.projectName=SkillSync

# platform/db is analysed by ruff and mypy in its own workflow but is not listed
# here. It is model declarations, a session factory, and two Alembic chains,
# exercised by the suites that import it rather than by tests of its own, and
# Sonar reports a package it has no coverage report for as untested rather than
# as unmeasured. Measuring it from the ingestion suite was tried and produced a
# coverage report with two different path roots, which Sonar cannot resolve.

sonar.sources=backend/app,frontend/src,platform/skills/platform_skills,services/job-ingestion-service/job_ingestion
sonar.tests=backend/tests,frontend/src,platform/skills/tests,services/job-ingestion-service/tests
sonar.test.inclusions=backend/tests/**,platform/skills/tests/**,services/job-ingestion-service/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

sonar.exclusions=docs/**,agent-skills/**,**/node_modules/**,**/.next/**,**/coverage/**,**/__pycache__/**,**/migrations/**,**/.sonar-venv/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

sonar.python.coverage.reportPaths=backend/coverage.xml,platform/skills/coverage.xml,services/job-ingestion-service/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
