[build-system]
requires = ["setuptools>=84.0.0,<85.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsync-job-ingestion"
version = "0.1.0"
description = "SkillSync job ingestion service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx2>=2.12.0,<3.0.0",
  "pydantic>=2.13.4,<3.0.0",
  "skillsync-platform-db==0.1.0",
  "sqlalchemy[asyncio]>=2.0.52,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1,<3.0.0",
  "pytest>=9.1.1,<10.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "ruff>=0.16.3,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["job_ingestion*"]
