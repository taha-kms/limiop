name: Shared packages

on:
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform.yml'
      - '.github/codecov.yml'
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - '.github/workflows/platform.yml'
      - '.github/codecov.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The database package is declarative: models, a session factory, and two
  # Alembic chains, exercised by the suites that import it rather than by tests
  # of its own. Measured alone it reports 1%, so this job gates format, lint,
  # types, and its own tests, and publishes no coverage number that would be
  # read as a verdict on how well it is tested.
  database:
    name: Validate the shared database package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/db/pyproject.toml

      - name: Install the shared database package
        working-directory: platform/db
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check formatting
        working-directory: platform/db
        run: ruff format --check .

      - name: Lint the shared database package
        working-directory: platform/db
        run: ruff check .

      - name: Type-check the shared database package
        working-directory: platform/db
        run: mypy

      - name: Test the shared database package
        working-directory: platform/db
        run: pytest

  extractor:
    name: Validate the shared extractor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/skills/pyproject.toml

      - name: Install the shared extractor
        working-directory: platform/skills
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check formatting
        working-directory: platform/skills
        run: ruff format --check .

      - name: Lint the shared extractor
        working-directory: platform/skills
        run: ruff check .

      - name: Type-check the shared extractor
        working-directory: platform/skills
        run: mypy

      - name: Test the shared extractor
        working-directory: platform/skills
        run: pytest

      - name: Upload shared extractor coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: platform/skills/coverage.xml
          flags: platform-skills
          use_oidc: true
