name: Shared packages

on:
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform.yml'
      - '.github/codecov.yml'
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - '.github/workflows/platform.yml'
      - '.github/codecov.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The database package is declarative: models, a session factory, and two
  # Alembic chains. Its behaviour is exercised by the suites that use it, and
  # the ingestion suite measures it directly, so this job gates format, lint,
  # types, and its own tests without a coverage floor of its own.
  database:
    name: Validate the shared database package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/db/pyproject.toml

      - name: Install the shared database package
        working-directory: platform/db
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check formatting
        working-directory: platform/db
        run: ruff format --check .

      - name: Lint the shared database package
        working-directory: platform/db
        run: ruff check .

      - name: Type-check the shared database package
        working-directory: platform/db
        run: mypy

      - name: Test the shared database package
        working-directory: platform/db
        run: pytest

  extractor:
    name: Validate the shared extractor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/skills/pyproject.toml

      - name: Install the shared extractor
        working-directory: platform/skills
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check formatting
        working-directory: platform/skills
        run: ruff format --check .

      - name: Lint the shared extractor
        working-directory: platform/skills
        run: ruff check .

      - name: Type-check the shared extractor
        working-directory: platform/skills
        run: mypy

      - name: Test the shared extractor
        working-directory: platform/skills
        run: pytest

      - name: Upload shared extractor coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: platform/skills/coverage.xml
          flags: platform-skills
          use_oidc: true
