name: Architecture boundaries

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Enforce architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/skills/pyproject.toml

      # This job runs on every pull request, because a boundary can be broken
      # by a change to any package. Formatting, linting, type checks, and the
      # extractor's own tests belong to the Shared packages workflow, which
      # only runs when platform/ changes; only pytest itself is needed here.
      - name: Install test dependencies
        run: python -m pip install -e 'platform/skills[dev]'

      - name: Check architecture boundaries
        run: python -m pytest tests/architecture/test_boundaries.py
