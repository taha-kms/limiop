name: End to end

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'platform/db/**'
      - 'platform/skills/**'
      - 'services/job-ingestion-service/**'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'platform/db/**'
      - 'platform/skills/**'
      - 'services/job-ingestion-service/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    name: Validate the read path in a browser
    runs-on: ubuntu-latest
    env:
      SKILLSYNC_DATABASE_URL: postgresql+psycopg://skillsync_e2e:skillsync_e2e@localhost:5432/skillsync_e2e
      # The browser and the server both reach the API on the runner itself, so
      # one address serves for both here.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      SKILLSYNC_API_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:3000
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: skillsync_e2e
          POSTGRES_PASSWORD: skillsync_e2e
          POSTGRES_USER: skillsync_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillsync_e2e -d skillsync_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            platform/db/pyproject.toml
            services/job-ingestion-service/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../platform/db
          python -m pip install -e ../platform/skills
          python -m pip install -e ../services/job-ingestion-service
          python -m pip install -e '.[dev]'

      - name: Migrate and seed the catalogue
        working-directory: backend
        run: |
          alembic -c ../platform/db/alembic.ini upgrade head
          alembic upgrade head
          cd ../services/job-ingestion-service
          python -m scripts.seed_catalog

      - name: Start the API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && exit 0
            sleep 1
          done
          echo "the API never became healthy" >&2
          cat api.log >&2
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm clean-install

      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build and start the frontend
        working-directory: frontend
        run: |
          npm run build
          nohup npx next start --port 3000 > next.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/jobs > /dev/null && exit 0
            sleep 1
          done
          echo "the frontend never became reachable" >&2
          cat next.log >&2
          exit 1

      - name: Run the browser test
        working-directory: frontend
        run: npm run test:e2e

      # Traces and screenshots are kept only for a failure. The catalogue is
      # public and seeded, so they carry nothing personal, but there is no
      # reason to store artifacts for a passing run.
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: browser-test-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/api.log
            frontend/next.log
          retention-days: 7
