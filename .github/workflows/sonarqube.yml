name: SonarQube

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Quality gate
    runs-on: ubuntu-latest
    env:
      SKILLSYNC_TEST_DATABASE_URL: postgresql+psycopg://skillsync_test:skillsync_test@localhost:5432/skillsync_test
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: skillsync_test
          POSTGRES_PASSWORD: skillsync_test
          POSTGRES_USER: skillsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillsync_test -d skillsync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history lets SonarQube attribute issues to the correct commits.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            platform/db/pyproject.toml

      - name: Generate backend coverage
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../platform/db
          python -m pip install -e '.[dev]'
          pytest

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate frontend coverage
        working-directory: frontend
        run: |
          npm clean-install
          npm run test -- --coverage

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
