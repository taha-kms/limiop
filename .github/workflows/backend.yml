name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/backend.yml'
      - '.github/codecov.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/backend.yml'
      - '.github/codecov.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    env:
      SKILLSYNC_TEST_DATABASE_URL: postgresql+psycopg://skillsync_test:skillsync_test@localhost:5432/skillsync_test
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: skillsync_test
          POSTGRES_PASSWORD: skillsync_test
          POSTGRES_USER: skillsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillsync_test -d skillsync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check formatting
        working-directory: backend
        run: ruff format --check .

      - name: Lint backend
        working-directory: backend
        run: ruff check .

      - name: Type-check backend
        working-directory: backend
        run: mypy

      - name: Test backend
        working-directory: backend
        run: pytest

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: skillsync_test
          SKILLSYNC_DATABASE_URL: postgresql+psycopg://skillsync_test:skillsync_test@database:5432/skillsync_test
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build --tag skillsync-backend:test backend

      - name: Upload backend coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: backend/coverage.xml
          flags: backend
          use_oidc: true
