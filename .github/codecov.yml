# Coverage policy. Every deployable and shared package uploads under its own
# flag, so a change to one cannot be masked by another's coverage.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

comment:
  layout: reach, diff, flags
  require_changes: true

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/
    carryforward: true
  job-ingestion:
    paths:
      - services/job-ingestion-service/
    carryforward: true
  platform-skills:
    paths:
      - platform/skills/
    carryforward: true
  airflow:
    paths:
      - airflow/
    carryforward: true
  ml:
    paths:
      - ml/
    carryforward: true

ignore:
  - docs/**
  - agent-skills/**
  - '**/tests/**'
  - '**/*.spec.ts'
  - '**/*.test.ts'
