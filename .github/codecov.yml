# Coverage policy for production packages that publish coverage from CI.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

comment:
  layout: reach, diff, flags
  require_changes: true

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  platform_db:
    paths:
      - platform/db/
    carryforward: true
  platform_skills:
    paths:
      - platform/skills/
    carryforward: true
  ingestion:
    paths:
      - services/job-ingestion-service/
    carryforward: true
  frontend:
    paths:
      - frontend/
    carryforward: true
  airflow:
    paths:
      - airflow/
    carryforward: true
  ml:
    paths:
      - ml/
    carryforward: true

ignore:
  - docs/**
  - agent-skills/**
  - '**/tests/**'
  - '**/*.spec.ts'
  - '**/*.test.ts'
