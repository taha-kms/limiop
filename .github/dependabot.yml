version: 2

updates:
  # Only the GitHub Actions ecosystem exists in the repository today. Add pip
  # entries for backend/, airflow/, and ml/ and an npm entry for frontend/ as
  # those services introduce their manifests.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
