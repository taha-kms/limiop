[build-system]
requires = ["setuptools>=84.0.0,<85.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsync-platform-db"
version = "0.1.0"
description = "Shared database package for SkillSync services"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.19.1,<2.0.0",
  "psycopg[binary]>=3.3.4,<4.0.0",
  "sqlalchemy[asyncio]>=2.0.52,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1,<3.0.0",
  "pytest>=9.1.1,<10.0.0",
  "ruff>=0.16.3,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["platform_db*"]
