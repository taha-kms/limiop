[build-system]
requires = ["setuptools>=84.0.0,<85.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsync-backend"
version = "0.1.0"
description = "SkillSync backend API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.19.1,<2.0.0",
  "fastapi>=0.141.1,<1.0.0",
  "psycopg[binary]>=3.3.4,<4.0.0",
  "pydantic-settings>=2.15.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.52,<3.0.0",
  "uvicorn[standard]>=0.52.3,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12.0,<3.0.0",
  "mypy>=2.3.1,<3.0.0",
  "pytest>=9.1.1,<10.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "ruff>=0.16.3,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=app",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-fail-under=80",
]
testpaths = ["tests"]
markers = [
  "integration: requires a PostgreSQL test database",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["app", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
