[build-system]
requires = ["setuptools>=84.0.0,<85.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsync-backend"
version = "0.1.0"
description = "SkillSync backend API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.19.1,<2.0.0",
  # Imported directly for the bounded worker-thread pool the password hashing
  # runs in, so it is a dependency of ours and not only of Starlette's.
  "anyio>=4.14.0,<5.0.0",
  "argon2-cffi>=25.1.0,<26.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "fastapi>=0.141.1,<1.0.0",
  "httpx2>=2.12.0,<3.0.0",
  "psycopg[binary]>=3.3.4,<4.0.0",
  "pydantic-settings>=2.15.0,<3.0.0",
  "pyjwt>=2.10.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.52,<3.0.0",
  "uvicorn[standard]>=0.52.3,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1,<3.0.0",
  "pytest>=9.1.1,<10.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "ruff>=0.16.3,<1.0.0",
]
# Only the measurement tooling under `scripts/` needs these, and the served
# application must not grow a dependency because a one-off study wanted one.
research = [
  "py3langid>=0.3.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=app",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-fail-under=80",
]
testpaths = ["tests"]
markers = [
  "integration: requires a PostgreSQL test database",
]

[tool.coverage.run]
branch = true
source = ["app"]
# SQLAlchemy's async layer resumes coroutines through a greenlet switch, and
# without this the tracer loses every line after the first await in a route.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["app", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts", "tests"]

[[tool.mypy.overrides]]
# py3langid ships no type information. It is used only by the measurement
# tooling, behind one wrapper that gives it a typed surface.
module = ["py3langid.*"]
ignore_missing_imports = true
